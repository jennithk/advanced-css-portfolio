<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Contact Jennith through the portfolio website."
  >

  <title>Contact | Jennith</title>

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <header>

    <div class="container navbar">

      <h1 class="logo">Jennith</h1>

      <nav aria-label="Main Navigation">

        <ul class="nav-links">

          <li>
            <a href="index.html">
              Home
            </a>
          </li>

          <li>
            <a href="projects.html">
              Projects
            </a>
          </li>

          <li>
            <a href="contact.html">
              Contact
            </a>
          </li>

        </ul>

      </nav>

      <button class="theme-toggle">
        Dark Mode
      </button>

    </div>

  </header>

  <main id="main-content">

    <section>
      <div class="container">

        <h2 class="section-title">
          Contact Me
        </h2>

        <form class="contact-form" aria-label="Contact Form">

          <input
            type="text"
            id="name"
            name="name"
            placeholder="Full Name"
            required
            autocomplete="name"
          >

          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email Address"
            required
            autocomplete="email"
          >

          <textarea
            id="message"
            name="message"
            rows="6"
            placeholder="Your Message"
            required
          ></textarea>

          <button
            type="submit"
            class="btn btn-primary"
          >
            Send Message
          </button>

        </form>

      </div>
    </section>

  </main>

  <footer>
    <div class="container">
      <p>© 2026 Jennith. All Rights Reserved.</p>
    </div>
  </footer>

</body>
</html>
